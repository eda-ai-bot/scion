# Local development stack: metadata DB (Postgres) + object store (MinIO, S3-compatible).
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#
# scion-server / scion-cache services are added in Phase 3 / Phase 4 of the roadmap.
# Until then this file only provides the storage backends used by integration tests.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: scion
      POSTGRES_DB: scion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion -d scion"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scion
      MINIO_ROOT_PASSWORD: scionscion
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the object bucket.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 scion scionscion &&
        mc mb --ignore-existing local/scion-objects
      "

volumes:
  pgdata:
  miniodata:
