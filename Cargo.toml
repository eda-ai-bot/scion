[workspace]
resolver = "3"
members = [
    "crates/scion-types",
    "crates/scion-store",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tekeburak/scion"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
scion-types = { path = "crates/scion-types" }
scion-store = { path = "crates/scion-store" }

# Hashing / encoding
blake3 = "1.5"
hex = "0.4"
bytes = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"

# Errors / serde
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# Testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
